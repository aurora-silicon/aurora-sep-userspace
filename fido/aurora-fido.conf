# aurora-fidod settings. Defaults shown; restart aurora-fido.service after a change.

[touchid]
# Whose finger counts: "auto" = the user of the active local session on seat0.
user = auto
# Seconds to wait for a touch before the request fails (USER_ACTION_TIMEOUT).
timeout = 30
# Touches per prompt before a request is refused (OPERATION_DENIED), like sudo.
max_tries = 3
# Desktop notification "Touch ID to sign in to <site>" while waiting.
notify = yes
# Who may approve a new credential's use (fixed per credential when it is
# made, as a macOS key's access control):
#   touchid-or-password  Touch ID, or your password (polkit dialog) when Touch ID
#                        does not match, is locked out or unavailable (default)
#   touchid-any          Touch ID only, any enrolled finger
#   touchid-current      Touch ID only, and only the fingers enrolled now: adding
#                        or removing a finger retires the credential
policy = touchid-or-password
# Seconds to wait for the password dialog.
password_timeout = 60

[authenticator]
# "self": packed self attestation (signed by the new key). "none": no statement.
# Nothing here can prove Apple hardware to a website.
attestation = self
# Discoverable credentials (passkeys) this Mac keeps.
max_resident = 256
# Answer CTAP1/U2F requests too.
u2f = yes

[keys]
# Where credential keys live.
#   auto     the Secure Enclave (/dev/sep-key) when the kernel has it, otherwise
#            keys sealed by the Secure Enclave (see `aurora-fido status`)
#   sep-key  the Secure Enclave only; the service does not start without it
#   sealed   sealed keys for new credentials (Secure Enclave ones still work)
store = auto
# Have the Secure Enclave enforce touchid-any / touchid-current itself (keys
# created with SEPKEY's biometric access-control flags, the touch checked
# inside the signature) when the kernel offers them. Off until linux#1196's
# enclave policies are qualified on hardware; the daemon checks the touch.
enclave_policy = no
