# aurora-fidod settings. Defaults shown; restart aurora-fido.service after a change.
#
# The Secure Enclave checks every Touch ID match itself, inside the signature.
# Nothing here can make the daemon approve a request without it.

[touchid]
# Who gets the "Touch ID to sign in to <site>" notification: "auto" = the user
# of the active local session on seat0 (whoever can reach the sensor).
user = auto
# Seconds to wait for a touch (USER_ACTION_TIMEOUT). The enclave waits at most
# about a minute; a shorter wait needs a kernel that can cancel (status says).
timeout = 30
# Touches per prompt before a request is refused (OPERATION_DENIED), like sudo.
max_tries = 3
# Desktop notification while waiting.
notify = yes
# Who may approve a new credential's use, fixed in the key's enclave
# access-control list when it is made (as a macOS key's access control):
#   auto                 touchid-or-password when the kernel lets the Secure
#                        Enclave check your password, else touchid-any (default)
#   touchid-or-password  Touch ID, or your password checked by the Secure Enclave
#                        (refused on kernels that cannot: never checked elsewhere)
#   touchid-any          Touch ID only, any enrolled finger
#   touchid-current      Touch ID only, and only the fingers enrolled now: adding
#                        or removing a finger retires the credential
policy = auto

[authenticator]
# "self": packed self attestation (signed by the new key). "none": no statement.
# Nothing here can prove Apple hardware to a website.
attestation = self
# Discoverable credentials (passkeys) this Mac keeps.
max_resident = 256
# Answer CTAP1/U2F requests too.
u2f = yes
# Whose credentials: "system" keeps them in /var/lib/aurora-fido. "user" (preview)
# forwards each request to the passkey agent of the user active on seat0
# (aurora-passkeyd, a user unit); it needs /dev/sep-key interface 4, and has no U2F.
vault = system

[keys]
# Where credential keys live: the Secure Enclave (/dev/sep-key), always.
# "auto" and "sep-key" mean the same; there is no other store.
store = auto
