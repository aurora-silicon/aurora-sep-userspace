name: Source patches

on:
  pull_request:
  push:
    branches: [main]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply libfprint patches to the packaged release
        run: |
          curl -fsSL https://gitlab.freedesktop.org/libfprint/libfprint/-/archive/v1.94.100/libfprint-v1.94.100.tar.gz -o libfprint.tar.gz
          tar -xzf libfprint.tar.gz
          cd libfprint-v1.94.100
          git init -q
          git apply ../libfprint/libfprint-1.94.100-apple-sep.patch
          git apply ../libfprint/0002-aurora-report-unusable-captures-as-retries.patch
          git apply ../libfprint/0003-hide-lid-covered-readers-while-the-lid-is-closed.patch
          git apply ../libfprint/0004-aurora-refuse-unbound-enrollment.patch
          git apply ../libfprint/0005-aurora-support-v4-and-v5.patch
          git apply ../libfprint/0006-aurora-report-finger-lift-and-lockout.patch
          git apply ../libfprint/0007-aurora-name-retry-causes-and-keep-waiting.patch
          git apply ../libfprint/0008-aurora-report-the-touch-id-lockout-as-locked-out.patch
          git apply ../libfprint/0009-aurora-say-why-touch-id-needs-the-password.patch
          python3 ../libfprint/test_interface.py libfprint/drivers/aurora/aurora.c ../libfprint/apple-sep.h
          python3 ../libfprint/test_lockout_reason.py libfprint/drivers/aurora/aurora.c
          grep -q '^#define SEP_BIO_IFACE_VERSION  5' ../libfprint/apple-sep.h
      - name: Check biometric ioctl ABI sizes
        run: |
          cat > abi.c <<'EOF'
          #include "libfprint/apple-sep.h"
          _Static_assert(sizeof(struct sep_bio_enrol_start) == 144, "enrol ABI");
          _Static_assert(sizeof(struct sep_bio_enclave_list) == 520, "list ABI");
          _Static_assert(sizeof(struct sep_bio_delete) == 16, "delete ABI");
          _Static_assert(sizeof(struct sep_bio_lockout) == 16, "lockout ABI");
          _Static_assert(SEP_BIO_LOCKOUT_FLAG_AFTER_BOOT == 2, "after-boot flag");
          _Static_assert(SEP_BIO_LOCKOUT_FLAG_FAILED_ATTEMPTS == 4, "failed-attempts flag");
          int main(void) { return 0; }
          EOF
          cc -Wall -Werror -I. abi.c -o abi
          ./abi
      - name: Apply fprintd patch to the packaged release
        run: |
          curl -fsSL https://gitlab.freedesktop.org/libfprint/fprintd/-/archive/v1.94.5/fprintd-v1.94.5.tar.gz -o fprintd.tar.gz
          tar -xzf fprintd.tar.gz
          cd fprintd-v1.94.5
          git init -q
          git apply ../fprintd/0001-preserve-print-on-device-delete-failure.patch
          git apply ../fprintd/0002-report-lockout-and-fall-back-to-the-password.patch
          git apply ../fprintd/0003-say-why-the-reader-needs-the-password.patch
          python3 -m py_compile tests/fprintd.py
          python3 ../fprintd/test_account_gate.py src/device.c

  luks-token:
    # Not in a container: Docker's seccomp profile blocks add_key/keyctl.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcryptsetup-dev libjson-c-dev cryptsetup-bin pkgconf
      - name: Build, unit and LUKS2 file-image tests (kernel user keys stand in for the SEP)
        # As root: kernels with af_alg_restrict let only CAP_SYS_ADMIN or
        # CAP_NET_ADMIN bind ccm(aes) through AF_ALG.
        # The Ubuntu runner disables algif_aead with an `install /bin/false`
        # modprobe rule, so AF_ALG AEAD binds fail with ENOENT; load it anyway
        # on this throwaway VM, with the ccm template.
        run: |
          sudo modprobe --ignore-install -a algif_aead ccm
          sudo python3 -c "import socket; s=socket.socket(socket.AF_ALG, socket.SOCK_SEQPACKET); s.bind(('aead','ccm(aes)')); print('AF_ALG ccm(aes) bind ok')"
          make -C luks
          sudo make -C luks check
          make -C fido test/aurora-fido-seal
          sudo make -C fido check-seal
      - name: AF_ALG diagnostics
        if: failure()
        run: |
          uname -r
          cat /proc/sys/crypto/af_alg_restrict || true
          grep -A3 -E '^name +: ccm\(aes\)' /proc/crypto || echo "no ccm(aes) instance yet"
          sudo python3 -c "import socket; s=socket.socket(socket.AF_ALG, socket.SOCK_SEQPACKET); s.bind(('aead','ccm(aes)')); print('ccm bind ok')" || true
          sudo modprobe ccm && echo "ccm module loaded" || true
      - name: Shell syntax
        run: |
          sh -n luks/tests/hw-loop-test.sh && sh -n luks/tests/test-luks.sh
          bash -n fido/tests/test-uhid.sh && bash -n fido/tests/test-seal.sh

  sk-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkgconf openssh-client openssh-server git
      - name: Build and test the OpenSSH provider (software keys stand in for the SEP)
        run: |
          make -C sk
          make -C sk check
          make -C sk install DESTDIR=$PWD/dest
          test -f dest/usr/lib/libaurora-sep-sk.so
          test -f dest/usr/lib/udev/rules.d/70-aurora-sep-key.rules
      - name: Shell syntax
        run: sh -n sk/tests/test-sk.sh

  luks-token-fedora:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Build against Fedora's cryptsetup
        run: |
          dnf -y install gcc make pkgconf-pkg-config cryptsetup-devel json-c-devel
          make -C luks
          make -C luks install DESTDIR=$PWD/dest
          test -x dest/usr/bin/aurora-sep-cryptenroll
          test -f dest/usr/lib64/cryptsetup/libcryptsetup-token-aurora-sep.so
          make -C fido
          make -C fido install DESTDIR=$PWD/dest
          test -x dest/usr/libexec/aurora-fido/aurora-fidod
          test -x dest/usr/bin/aurora-fido
          grep -q '^disable aurora-fido.service' dest/usr/lib/systemd/system-preset/90-aurora-fido.preset
          grep -q 'aurora-fido-seal' dest/usr/bin/aurora-fido
          ! grep -rqiE 'demo|test harness' dest/usr/libexec/aurora-fido dest/usr/lib/aurora-fido dest/usr/bin/aurora-fido dest/usr/lib/systemd
          test -x dest/usr/libexec/aurora-fido/aurora-fido-seal
          test -f dest/usr/lib/aurora-fido/aurora_fido/ctap2.py
          test -f dest/usr/lib/systemd/system/aurora-fido.service

  fido:
    # Not in a container: the uhid device and its hidraw node belong to the VM.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography fido2-tools libfido2-1 openssh-client \
            libpam-u2f pamu2fcfg pamtester cryptsetup-bin
          # systemd-cryptenroll and its FIDO2 token plugin: in 'systemd' on noble, split out later.
          sudo apt-get install -y systemd-cryptsetup || true
      - name: Unit tests (software keys, scripted Touch ID)
        run: make -C fido check
      - name: uhid device with libfido2, OpenSSH, pam_u2f and systemd-cryptenroll
        run: |
          sudo modprobe uhid || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uhid; }
          sudo modprobe -a hid-generic hidraw 2>/dev/null || true
          sudo make -C fido check-uhid
      - name: uhid device on the shipped sealed key store
        run: sudo KEYS=sealed make -C fido check-uhid

  build:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf -y install curl tar git gcc gcc-c++ meson ninja-build rpm-build pkgconf-pkg-config \
            glib2-devel libgusb-devel libgudev-devel polkit-devel gettext \
            gobject-introspection-devel python3-gobject python3-dbusmock python3-cairo \
            pam-devel pam_wrapper python3-libpamtest systemd-devel
      - name: Parse package specs
        run: |
          rpmspec -P libfprint/libfprint.spec >/dev/null
          rpmspec -P fprintd/fprintd.spec >/dev/null
      - name: Build packaged Aurora libfprint driver
        run: |
          curl -fsSL https://gitlab.freedesktop.org/libfprint/libfprint/-/archive/v1.94.100/libfprint-v1.94.100.tar.gz -o libfprint.tar.gz
          tar -xzf libfprint.tar.gz
          cd libfprint-v1.94.100
          git init -q
          git apply ../libfprint/libfprint-1.94.100-apple-sep.patch
          git apply ../libfprint/0002-aurora-report-unusable-captures-as-retries.patch
          git apply ../libfprint/0003-hide-lid-covered-readers-while-the-lid-is-closed.patch
          git apply ../libfprint/0004-aurora-refuse-unbound-enrollment.patch
          git apply ../libfprint/0005-aurora-support-v4-and-v5.patch
          git apply ../libfprint/0006-aurora-report-finger-lift-and-lockout.patch
          git apply ../libfprint/0007-aurora-name-retry-causes-and-keep-waiting.patch
          git apply ../libfprint/0008-aurora-report-the-touch-id-lockout-as-locked-out.patch
          git apply ../libfprint/0009-aurora-say-why-touch-id-needs-the-password.patch
          install -Dm644 ../libfprint/apple-sep.h aurora-uapi/linux/apple-sep.h
          CFLAGS="-I$(pwd)/aurora-uapi" meson setup build -Ddrivers=aurora,virtual_image,virtual_device,virtual_device_storage -Dintrospection=true -Ddoc=false -Dinstalled-tests=false -Dudev_rules=disabled -Dudev_hwdb=disabled
          meson compile -C build
          meson install -C build
      - name: Build patched fprintd
        run: |
          curl -fsSL https://gitlab.freedesktop.org/libfprint/fprintd/-/archive/v1.94.5/fprintd-v1.94.5.tar.gz -o fprintd.tar.gz
          tar -xzf fprintd.tar.gz
          cd fprintd-v1.94.5
          git init -q
          git apply ../fprintd/0001-preserve-print-on-device-delete-failure.patch
          git apply ../fprintd/0002-report-lockout-and-fall-back-to-the-password.patch
          git apply ../fprintd/0003-say-why-the-reader-needs-the-password.patch
          PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig meson setup build -Dpam=true -Dman=false -Dsystemd=false -Dgtk_doc=false
          meson compile -C build
      - name: Run failed-delete fprintd regression cases
        env:
          GI_TYPELIB_PATH: /usr/local/lib64/girepository-1.0
          LD_LIBRARY_PATH: /usr/local/lib64
        run: |
          cd fprintd-v1.94.5
          export FPRINT_BUILD_DIR="$PWD/build/src" TOPSRCDIR="$PWD"
          python3 tests/fprintd.py \
            FPrintdVirtualDeviceStorageClaimedTest.test_delete_enrolled_fingers_device_error \
            FPrintdVirtualDeviceStorageClaimedTest.test_delete_enrolled_fingers2_device_error \
            FPrintdVirtualDeviceStorageClaimedTest.test_delete_enrolled_finger_device_error
      - name: Run password-reason fprintd and pam_fprintd cases
        env:
          GI_TYPELIB_PATH: /usr/local/lib64/girepository-1.0
          LD_LIBRARY_PATH: /usr/local/lib64
        run: |
          cd fprintd-v1.94.5
          export FPRINT_BUILD_DIR="$PWD/build/src" TOPSRCDIR="$PWD"
          python3 tests/fprintd.py \
            FPrintdVirtualDeviceVerificationTests.test_verify_error_locked_out \
            FPrintdVirtualDeviceVerificationTests.test_verify_error_password_required \
            FPrintdVirtualDeviceVerificationTests.test_verify_error_password_required_after_boot
          meson test -C build --print-errorlogs --suite test_pam_fprintd

  touchid-rearm:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: dnf -y install make gcc pam-devel python3
      - name: Build and test the PAM re-arm module and service
        run: make -C touchid-rearm check
