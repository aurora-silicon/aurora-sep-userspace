# /etc/aurora/touchid.conf: Touch ID settings (aurora-touchid-rearm).

# Touch ID after a restart.
#   no  (default): Touch ID works from the first login after boot.
#   yes: as on macOS, the first login or unlock after boot needs the password;
#        Touch ID works after that password.
# Read once per boot by aurora-touchid-boot.service; a change applies from
# the next boot. Any value other than yes or no counts as yes.
require_password_after_boot = no
