# /etc/aurora/touchid.conf: Touch ID settings (aurora-touchid-rearm).

# Touch ID after a restart.
#   yes (default): as on macOS, the first login or unlock after boot needs
#        the password ("Your password is required to enable Touch ID.");
#        Touch ID works after that password.
#   no:  Touch ID works from the first login after boot.
# Read once per boot by aurora-touchid-boot.service; a change applies from
# the next boot. Any value other than yes or no counts as yes, and so does a
# missing line. Uncomment and set it to change the default.
#require_password_after_boot = yes
