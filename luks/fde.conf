# Secure Enclave disk encryption (aurora-sep-fde). See docs/luks-sep-owners.md.

# Recovery key: "offline" also adds a plain LUKS2 keyslot for it, so the volume
# opens at the passphrase prompt when this Mac's Secure Enclave cannot answer
# (never a brick). "sep-only" keeps every unlock inside the enclave, as
# FileVault does. Applies to recovery keys made from now on; the recovery
# command's --offline / --sep-only picks per key, and --replace switches one.
recovery = offline

# Before the initramfs asks the Secure Enclave for a volume key (the root
# volume): "warn" logs once per boot when the boot chain is not verified from
# Stage 1 on (/sys/firmware/aurora/boot_security/state) and unlocks anyway;
# "require" leaves the volume to its passphrase or recovery key unless the
# chain is verified. Set require only on a Mac with an enforcing Stage 1 and a
# signed UKI; anywhere else every boot falls back to the passphrase.
boot-chain = warn

# Members of these groups (and root) become volume owners when they are added.
admin-groups = wheel sudo admin

# Enclave key bag uid = this base + the Linux uid.
bag-uid-base = 60000
